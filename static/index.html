<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>Media Browser</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div id="topBar">
        <button onclick="sync()">刷新</button>
        <button onclick="addRoot()">新增</button>
        <button onclick="deleteRoot()">删除</button>
    </div>

    <div id="listView">
        <div id="list"></div>
    </div>

    <div id="viewerView" hidden>
        <img id="image" hidden>
        <video id="videoA" controls></video>
        <video id="videoB" controls style="display:none;"></video>
    </div>

    <script src="/static/index.js"></script>
    <script>
        function sync() {
            fetch("/admin/sync", {
                method: "POST"
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) { alert(data.msg || "OK"); }
                    else { alert(data.msg || "Failed"); }
                })
                .catch(err => { alert("Failed"); });
        }
        function addRoot() {
            const path = prompt("请输入新增根目录路径:");
            if (!path) return;

            fetch("/admin/add_root", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(path)
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) { alert(data.msg || "OK"); }
                    else { alert(data.msg || "Failed"); }
                })
                .catch(err => { alert("Failed"); });
        }
        function deleteRoot() {
            const path = prompt("请输入要删除的根目录路径:");
            if (!path) return;

            fetch("/admin/delete_root", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(path)
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) { alert(data.msg || "OK"); }
                    else { alert(data.msg || "Failed"); }
                })
                .catch(err => { alert("Failed"); });
        }
    </script>
</body>

</html>
