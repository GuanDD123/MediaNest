<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000"> 
    <meta name="apple-mobile-web-app-title" content="Media Browser">
    <title>Media Browser</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div id="topBar" style="display: none;">
        <div id="leftTopBar">
            <button onclick="sync()" title="同步">🔄</button>
            <button onclick="addRoot()" title="新增">➕</button>
            <button onclick="deleteRoot()" title="删除">➖</button>
        </div>
        <div id="rightTopBar">
            <button onclick="continueLastPlay()" title="继续上次播放">▶️</button>
            <button onclick="filterMarked()" title="筛选标记">⭐</button>
            <span></span>
            <button onclick="toggleViewMode()" title="切换为网格视图">📋</button>
        </div>
    </div>

    <div id="listView">
        <div id="folderActions" style="display: none; margin-bottom: 10px;">
            <button class="shuffle-btn" onclick="shufflePlay()">🔀 随机播放当前目录</button>
        </div>
        <div id="list"></div>
    </div>

    <div id="viewerView" hidden>
        <div id="viewerTopBar">
            <span id="viewerTitle">加载中...</span>
            <div class="viewer-actions">
                <button id="markBtn" onclick="toggleCurrentMark()" title="标记/取消标记">☆</button>
                <button id="viewerDeleteBtn" onclick="deleteCurrentMedia()" title="删除当前文件">🗑️</button>
                <button id="closeBtn" onclick="closeViewer()" title="返回列表">❌</button>
            </div>
        </div>

        <img id="image" hidden>
        <video id="video" hidden playsinline webkit-playsinline></video>

        <div id="viewerBottomBar" hidden>
            <button class="ctrl-btn" onclick="prevMedia()" title="上一个视频">⏮️</button>
            <button class="ctrl-btn" onclick="togglePlayState()">⏯️</button>
            <button class="ctrl-btn" onclick="nextMedia()" title="下一个视频">⏭️</button>

            <span id="timeCurrent">00:00</span>
            <input type="range" id="progressBar" min="0" value="0" step="0.1">
            <span id="timeTotal">00:00</span>
            <button class="ctrl-btn" onclick="toggleCustomFullScreen()">⛶</button>
        </div>
    </div>

    <script src="/static/state.js"></script>
    <script src="/static/utils.js"></script>
    <script src="/static/listManager.js"></script>
    <script src="/static/viewer.js"></script>
    <script src="/static/main.js"></script>
    <script src="/static/bar.js"></script>
</body>

</html>
