<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>Media Browser</title>

    <style>
        body {
            background: #8a6d6d;
            margin: 0;
        }

        .item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .item:hover {
            background: #c8bbbb;
        }

        #viewerView {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: black;
        }

        #image,
        #videoA,
        #videoB {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>

<body>
    <div id="listView">
        <div id="list"></div>
    </div>

    <div id="viewerView" hidden>
        <img id="image" hidden>
        <video id="videoA" controls></video>
        <video id="videoB" controls style="display:none;"></video>
    </div>

    <script>
        const listView = document.getElementById("listView");
        const list = document.getElementById("list");
        const viewerView = document.getElementById("viewerView");
        const image = document.getElementById("image");
        const videoA = document.getElementById("videoA");
        const videoB = document.getElementById("videoB");

        let mediaList = [];
        let mediaMap = new Map();
        let currentIndex = 0;
        let currentBuffer = videoA;
        let nextBuffer = videoB;

        loadFolder("/root");

        async function loadFolder(path) {
            closeViewer();
            list.innerHTML = "";
            mediaList = [];
            mediaMap.clear();

            const response = await fetch(path);
            const data = await response.json();

            data.forEach(item => {
                const div = document.createElement("div");
                div.className = "item";
                div.textContent = item.name;

                if (item.type !== "folder") {
                    mediaMap.set(item.path, mediaList.length);
                    mediaList.push(item);
                }

                div.onclick = () => {
                    if (item.type === "folder") {
                        loadFolder("/folder/" + item.path);
                    }
                    else if (item.type === "image") {
                        listView.hidden = true;
                        viewerView.hidden = false;
                        image.hidden = false;
                        showImage(mediaMap.get(item.path));
                    }
                    else {
                        listView.hidden = true;
                        viewerView.hidden = false;
                        image.hidden = true;
                        currentBuffer.style.display = "block";

                        currentIndex = mediaMap.get(item.path);

                        currentBuffer.src = "/video/" + item.path;
                        const buffer = currentBuffer;
                        buffer.onloadeddata = () => {
                            buffer.currentTime = 0;
                            buffer.play();
                        }

                        preloadNextVideo();
                    }
                }

                list.appendChild(div);
            });
        }
        function closeViewer() {
            viewerView.hidden = true;
            listView.hidden = false;

            image.hidden = true;
            image.src = "";

            [videoA, videoB].forEach(v => {
                v.pause();
                v.currentTime = 0;
                v.src = "";
                v.style.display = "none";
            });
        }

        viewerView.addEventListener("click", onViewerClick);
        function onViewerClick(e) {
            if (mediaList[currentIndex].type === "image") {
                const x = e.clientX;
                const w = window.innerWidth;
                if (x < w * 0.5) { prevImage(); }
                else { nextImage(); }
            }
        }
        function prevImage() {
            if (currentIndex > 0) { showImage(currentIndex - 1); }
        }
        function nextImage() {
            if (currentIndex < mediaList.length - 1) { showImage(currentIndex + 1); }
        }
        function showImage(index) {
            currentIndex = index
            const item = mediaList[index];

            image.src = "/image/" + item.path;

            if (currentIndex < mediaList.length - 1) { preloadNextImage(); }
        }
        function preloadNextImage() {
            const next = mediaList[currentIndex + 1];
            if (next?.type === "image") {
                const img = new Image();
                img.src = "/image/" + next.path;
            }
        }

        videoA.addEventListener("ended", onVideoEnded);
        videoB.addEventListener("ended", onVideoEnded);
        function onVideoEnded() {
            currentIndex++;
            if (currentIndex < mediaList.length) { switchVideo(); }
        }
        function switchVideo() {
            [currentBuffer, nextBuffer] = [nextBuffer, currentBuffer];

            nextBuffer.pause();
            currentBuffer.style.display = "block";
            nextBuffer.style.display = "none";
            currentBuffer.currentTime = 0;
            currentBuffer.play();

            if (currentIndex < mediaList.length - 1) { preloadNextVideo(); }
        }
        function preloadNextVideo() {
            const next = mediaList[currentIndex + 1];
            if (next?.type === "video") {
                nextBuffer.preload = "auto";
                nextBuffer.src = "/video/" + next.path;
                nextBuffer.pause();
                nextBuffer.load();
            }
        }
    </script>
</body>

</html>
